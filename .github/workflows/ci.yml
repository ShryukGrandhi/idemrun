name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -v
      - name: Example fleet (apply, then check must show no drift)
        working-directory: examples/webfleet
        run: |
          idemrun apply site.toml -i inventory.toml
          idemrun check site.toml -i inventory.toml
      - name: Benchmark (quick)
        run: python bench/bench.py --quick
